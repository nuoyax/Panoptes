<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9cf9"/>
      <stop offset="1" stop-color="#2b5db8"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>

  <!--
    Abstract Argus: the "all-seeing" reduced to geometry.
    One triangle = the mythical watchman; each vertex holds an eye.
    Edges = the gaze lines connecting his hundred eyes — nothing escapes
    the network of sight. Reads as both a face (two eyes + brow) and a
    constellation / network graph (subdomains discovered and linked).
  -->

  <!-- gaze lines between the eyes -->
  <g stroke="#bcd9ff" stroke-width="1.6" opacity="0.55" stroke-linecap="round">
    <line x1="20" y1="22" x2="44" y2="22"/>
    <line x1="20" y1="22" x2="32" y2="42"/>
    <line x1="44" y1="22" x2="32" y2="42"/>
  </g>

  <!-- triangle outline: the Panoptes figure -->
  <path d="M32 12 L52 46 L12 46 Z" fill="none" stroke="#dbeaff"
        stroke-width="2.6" stroke-linejoin="round" opacity="0.9"/>

  <!-- vertex eyes -->
  <!-- top vertex: the primary eye -->
  <g>
    <circle cx="32" cy="12" r="6.5" fill="#0a1440"/>
    <circle cx="32" cy="12" r="4.2" fill="#eaf4ff"/>
    <circle cx="32" cy="12" r="2" fill="#0a1440"/>
    <circle cx="33" cy="11" r="0.8" fill="#fff"/>
  </g>
  <!-- left vertex eye -->
  <g>
    <circle cx="12" cy="46" r="5" fill="#0a1440"/>
    <circle cx="12" cy="46" r="3" fill="#eaf4ff"/>
    <circle cx="12" cy="46" r="1.4" fill="#0a1440"/>
  </g>
  <!-- right vertex eye -->
  <g>
    <circle cx="52" cy="46" r="5" fill="#0a1440"/>
    <circle cx="52" cy="46" r="3" fill="#eaf4ff"/>
    <circle cx="52" cy="46" r="1.4" fill="#0a1440"/>
  </g>
  <!-- centroid eye: the ever-open inner gaze -->
  <g>
    <circle cx="32" cy="35" r="4" fill="#0a1440"/>
    <circle cx="32" cy="35" r="2.4" fill="#8fd0ff"/>
    <circle cx="32" cy="35" r="1.1" fill="#0a1440"/>
  </g>
</svg>
