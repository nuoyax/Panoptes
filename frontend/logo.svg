<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9cf9"/>
      <stop offset="1" stop-color="#2b5db8"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.35" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#4f9cf9"/>
    </radialGradient>
  </defs>
  <!-- shield: Panoptes the all-seeing -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <!-- peacock-feather eyes arranged around the great eye -->
  <g fill="#dbeaff" opacity="0.9">
    <circle cx="32" cy="13" r="3"/>
    <circle cx="45" cy="17" r="2.6"/>
    <circle cx="51" cy="28" r="2.4"/>
    <circle cx="51" cy="40" r="2.4"/>
    <circle cx="45" cy="49" r="2.6"/>
    <circle cx="32" cy="53" r="3"/>
    <circle cx="19" cy="49" r="2.6"/>
    <circle cx="13" cy="40" r="2.4"/>
    <circle cx="13" cy="28" r="2.4"/>
    <circle cx="19" cy="17" r="2.6"/>
  </g>
  <g fill="none" stroke="#9cc8ff" stroke-width="1.4" opacity="0.7">
    <circle cx="32" cy="13" r="5"/>
    <circle cx="45" cy="17" r="4.4"/>
    <circle cx="51" cy="28" r="4"/>
    <circle cx="51" cy="40" r="4"/>
    <circle cx="45" cy="49" r="4.4"/>
    <circle cx="32" cy="53" r="5"/>
    <circle cx="19" cy="49" r="4.4"/>
    <circle cx="13" cy="40" r="4"/>
    <circle cx="13" cy="28" r="4"/>
    <circle cx="19" cy="17" r="4.4"/>
  </g>
  <!-- the great central eye -->
  <circle cx="32" cy="32" r="12" fill="#0a0e14"/>
  <circle cx="32" cy="32" r="9" fill="url(#eye)"/>
  <circle cx="32" cy="32" r="4.2" fill="#0a1440"/>
  <circle cx="29.5" cy="29.5" r="1.6" fill="#ffffff"/>
</svg>
