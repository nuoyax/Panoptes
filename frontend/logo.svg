<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9cf9"/>
      <stop offset="1" stop-color="#2b5db8"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.35" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#3b7fd9"/>
    </radialGradient>
  </defs>

  <!-- rounded-square badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>

  <!-- Argus: a bearded giant head, many eyes across the face -->
  <g>
    <!-- hair / wild curls -->
    <path d="M14 30 Q12 12 26 9 Q32 7 38 9 Q52 12 50 30 Q52 24 48 18 Q46 24 42 17 Q40 23 36 15 Q33 21 32 14 Q30 21 28 15 Q24 23 22 17 Q18 24 16 18 Q12 24 14 30 Z"
          fill="#0d1b33" opacity="0.85"/>
    <!-- face -->
    <path d="M15 28 Q15 20 22 18 Q32 15 42 18 Q49 20 49 28 Q49 38 44 46 Q38 54 32 54 Q26 54 20 46 Q15 38 15 28 Z"
          fill="#e8d5b7"/>
    <!-- beard -->
    <path d="M19 42 Q22 56 32 58 Q42 56 45 42 Q40 50 32 50 Q24 50 19 42 Z"
          fill="#0d1b33" opacity="0.9"/>

    <!-- the many eyes (7 across the face) -->
    <!-- brow eyes -->
    <g>
      <ellipse cx="20" cy="26" rx="4.4" ry="3.4" fill="#fff"/>
      <circle cx="20" cy="26" r="2" fill="#1c2f55"/>
      <circle cx="20.8" cy="25.2" r="0.7" fill="#fff"/>

      <ellipse cx="32" cy="24" rx="4.8" ry="3.7" fill="#fff"/>
      <circle cx="32" cy="24" r="2.2" fill="#1c2f55"/>
      <circle cx="32.9" cy="23.1" r="0.8" fill="#fff"/>

      <ellipse cx="44" cy="26" rx="4.4" ry="3.4" fill="#fff"/>
      <circle cx="44" cy="26" r="2" fill="#1c2f55"/>
      <circle cx="44.8" cy="25.2" r="0.7" fill="#fff"/>
    </g>
    <!-- cheek eyes -->
    <g>
      <ellipse cx="24" cy="35" rx="3.4" ry="2.7" fill="#fff"/>
      <circle cx="24" cy="35" r="1.5" fill="#1c2f55"/>

      <ellipse cx="40" cy="35" rx="3.4" ry="2.7" fill="#fff"/>
      <circle cx="40" cy="35" r="1.5" fill="#1c2f55"/>
    </g>
    <!-- lower eyes near the beard -->
    <g>
      <ellipse cx="28" cy="43" rx="2.4" ry="2" fill="#fff"/>
      <circle cx="28" cy="43" r="1" fill="#1c2f55"/>

      <ellipse cx="36" cy="43" rx="2.4" ry="2" fill="#fff"/>
      <circle cx="36" cy="43" r="1" fill="#1c2f55"/>
    </g>
  </g>
</svg>
