<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panoptes · 子域名全景查询</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e14; --panel: #111823; --border: #1f2a3a;
      --text: #dbe4f0; --muted: #7d8ba1; --accent: #4f9cf9; --accent2: #7ee0b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background:
        radial-gradient(1200px 600px at 50% -10%, #14213a 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column; align-items: center; padding: 56px 16px 40px;
    }
    .logo {
      width: 64px; height: 64px; margin-bottom: 14px; border-radius: 50%;
      filter: drop-shadow(0 8px 24px rgba(217,142,74,.35));
    }
    h1 { margin: 0; font-size: 1.7rem; font-weight: 600; letter-spacing: .3px; }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); font-size: .88rem; margin: 8px 0 30px; }
    form {
      display: flex; width: 100%; max-width: 720px; gap: 10px; align-items: center;
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    input[type=text] {
      flex: 1; background: transparent; border: none; color: var(--text);
      font-size: 1.05rem; padding: 10px 12px; outline: none; min-width: 0;
      font-family: ui-monospace, Consolas, monospace;
    }
    input::placeholder { color: #55627a; }
    button.primary {
      background: linear-gradient(135deg, var(--accent), #3b7fd9); color: #fff;
      border: none; border-radius: 10px; padding: 10px 24px; font-size: .95rem;
      font-weight: 600; cursor: pointer; transition: filter .15s;
    }
    button.primary:hover { filter: brightness(1.1); }
    button:disabled { opacity: .5; cursor: wait; }
    .toggle {
      display: flex; align-items: center; gap: 6px; font-size: .85rem;
      color: var(--muted); cursor: pointer; padding: 0 8px; user-select: none; white-space: nowrap;
    }
    .toggle input { accent-color: var(--accent); cursor: pointer; flex: none; }
    #toolbar {
      width: 100%; max-width: 1100px; display: none; align-items: center;
      gap: 8px; margin: 22px 0 10px; flex-wrap: wrap;
    }
    #meta { color: var(--muted); font-size: .84rem; margin-right: auto; }
    #meta .alive { color: var(--accent2); }
    .chip {
      background: var(--panel); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 6px 14px; font-size: .82rem; cursor: pointer;
      transition: all .15s; display: inline-flex; align-items: center; gap: 5px;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .filter {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 6px 12px; font-size: .82rem; outline: none; width: 180px;
    }
    .filter::placeholder { color: #55627a; }
    #results {
      width: 100%; max-width: 1100px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 14px;
      overflow: auto; max-height: 62vh; box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    thead th {
      position: sticky; top: 0; background: #16202e; color: var(--muted);
      text-align: left; padding: 10px 14px; font-weight: 600; font-size: .78rem;
      border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1;
    }
    tbody td { padding: 8px 14px; border-bottom: 1px solid #182230; vertical-align: top; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #16202e; }
    td.sub { font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; color: var(--text); }
    td.ips { font-family: ui-monospace, Consolas, monospace; color: #55627a; font-size: .78rem; overflow-wrap: anywhere; }
    td.status { white-space: nowrap; font-family: ui-monospace, Consolas, monospace; }
    td.title { color: var(--muted); max-width: 320px; overflow-wrap: anywhere; }
    .st-2 { color: var(--accent2); } .st-3 { color: var(--accent); }
    .st-4, .st-5 { color: #f87171; }
    .badge { font-size: .7rem; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
    .badge.alive { background: rgba(126,224,184,.12); color: var(--accent2); }
    .badge.dead { background: rgba(248,113,113,.1); color: #f87171; }
    .port {
      display: inline-block; font-family: ui-monospace, Consolas, monospace;
      font-size: .75rem; padding: 1px 7px; margin: 1px; border-radius: 6px;
      background: rgba(79,156,249,.1); color: var(--accent);
    }
    .path {
      display: inline-block; font-family: ui-monospace, Consolas, monospace;
      font-size: .74rem; padding: 1px 7px; margin: 1px; border-radius: 6px;
      background: rgba(248,113,113,.1); color: #f87171;
    }
    .secval { font-size: .74rem; color: var(--muted); display: block; max-width: 260px; overflow-wrap: anywhere; }
    .sec-ok { color: var(--accent2); font-size: .78rem; }
    .sec-miss { color: #f87171; font-size: .74rem; display: block; max-width: 220px; overflow-wrap: anywhere; }
    .tls-ok { color: var(--accent2); font-size: .78rem; }
    .tls-warn { color: #fbbf24; font-size: .78rem; }
    .empty { color: var(--muted); padding: 28px; text-align: center; cursor: default; }
    .err { color: #f87171; }
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--accent2); color: #06281c; padding: 9px 20px; border-radius: 10px;
      font-size: .88rem; font-weight: 600; opacity: 0; pointer-events: none;
      transition: opacity .25s; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 10;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <img class="logo" src="logo.svg" alt="Panoptes — the all-seeing giant" title="Panoptes（Πανόπτης）百眼巨人：无所不见的守望者">
  <h1>Panoptes <span>· 子域名全景查询</span></h1>
  <div class="sub">百眼巨人守望 · Certificate Transparency 日志聚合 · 自托管子域名查询</div>

  <form id="f">
    <input id="apex" type="text" placeholder="example.com" autocomplete="off" autofocus spellcheck="false">
    <label class="toggle" title="并发解析 A 记录，标记真实存活的子域名">
      <input type="checkbox" id="dnsCheck" checked> DNS 验证
    </label>
    <label class="toggle" title="探测存活域名的 HTTP 状态码与网页标题">
      <input type="checkbox" id="httpCheck" checked> HTTP 探测
    </label>
    <label class="toggle" title="对 DNS 存活主机进行常见端口 TCP 扫描">
      <input type="checkbox" id="portCheck"> 端口扫描
    </label>
    <label class="toggle" title="敏感路径暴露 / 安全响应头缺失 / TLS 证书检查">
      <input type="checkbox" id="secCheck"> 安全检查
    </label>
    <button id="btn" class="primary" type="submit">查询</button>
  </form>

  <div id="toolbar">
    <span id="meta"></span>
    <input id="filter" class="filter" type="text" placeholder="过滤结果…">
    <button class="chip" data-fmt="txt">📄 TXT</button>
    <button class="chip" data-fmt="csv">📊 CSV</button>
    <button class="chip" data-fmt="json">{ } JSON</button>
  </div>
  <div id="results"><div class="empty">输入 apex 域名开始查询，例如 baidu.com</div></div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
